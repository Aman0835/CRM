<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <style>
    .brand-title { font-family: 'Montserrat', 'Helvetica', 'Inter', sans-serif; font-size: 36px; font-weight: 400; fill: #0f172a; letter-spacing: 10px; }
    .brand-sub { font-family: 'Montserrat', 'Helvetica', 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #94a3b8; letter-spacing: 5px; }
  </style>

  <!-- Logo Mark -->
  <g transform="translate(60, 30)">
    <!-- Thin Ring Outer -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Minimalist Real Estate Structure -->
    <!-- Modern Roofline Peak -->
    <path d="M35 64 L60 38 L85 64" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Main Structure Frame -->
    <path d="M43 56 V84 H77 V56" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Modern Entrance Gateway -->
    <path d="M54 84 V68 H66 V84" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Architectural Accent Window -->
    <circle cx="60" cy="52" r="2.5" fill="#0f172a" />
  </g>

  <!-- Typography -->
  <text x="195" y="86" class="brand-title">DOSTI</text>
  <text x="198" y="110" class="brand-sub">REAL ESTATE</text>
</svg>
